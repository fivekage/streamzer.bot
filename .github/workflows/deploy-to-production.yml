name: Deploy to Production

on:
  workflow_run:
    workflows: ["Deploy Docker Package"]
    branches: [main]
    types: 
      - completed
env:
  WORKDIR: '/home/hb/media_stack'
  env: production
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  env_file: .env.streamzerbot

jobs:
  build:
    runs-on: ubuntu-latest
    name: Deploy to On Premise Server
    permissions:
        contents: 'read'
        id-token: 'write'
    defaults:
        run:
          shell: bash
    steps:
        - name: Set environments variable in a file ${{ env.env_file }}
          uses: appleboy/ssh-action@v1.0.0
          with:
            host: ${{ vars.SSH_HOST }}
            username: ${{ vars.SSH_USERNAME }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            port: ${{ vars.SSH_PORT }}
            script: |
              mkdir -p ${{ env.WORKDIR }}
              cd ${{ env.WORKDIR }}
              [ -e ${{ env.env_file }} ] && rm ${{ env.env_file }}
              echo "NODE_ENV=${{ env.env }}" >> ${{ env.env_file }}
              echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> ${{ env.env_file }}
              echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> ${{ env.env_file }}
              echo "CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}" >> ${{ env.env_file }}
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> ${{ env.env_file }}
              echo "REDIRECT_URI=${{ vars.REDIRECT_URI }}" >> ${{ env.env_file }}
              echo "DISCORD_WEBHOOK_URL=${{ vars.DISCORD_WEBHOOK_URL }}" >> ${{ env.env_file }}

        - name: 'Trigger Deploying Production of streamzer.infra'
          env:
            REPO_TRIGGER_TOKEN: ${{ secrets.REPO_TRIGGER_TOKEN }}
          run: |
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.REPO_TRIGGER_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/fivekage/streamzer.infra/actions/workflows/deploy-resources.yml/dispatches \
              -d '{"ref":"main"}'

