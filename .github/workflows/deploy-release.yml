name: Deploy Docker Package & Create Release

on:
  push:
    tags:
      - "v*" # Exemple : v1.0.0, v2.3.4
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "docs/**"
      - ".gitignore"
      - ".github/**"
env:
  env: production
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

defaults:
  run:
    shell: bash

permissions: write-all

jobs:
  check-updates:
    runs-on: ubuntu-latest
    name: Check if package.json and changelog.md were updated
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get current and previous tag
        id: tags
        run: |
          git fetch --tags --force
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          # Récupère tous les tags triés par date
          ALL_TAGS=$(git tag --sort=-creatordate)
          # Trouve le tag précédent
          PREVIOUS_TAG=$(echo "$ALL_TAGS" | grep -A1 "^$CURRENT_TAG$" | tail -n1)

          echo "current=$CURRENT_TAG" >> $GITHUB_OUTPUT

          if [ "$CURRENT_TAG" = "$PREVIOUS_TAG" ] || [ -z "$PREVIOUS_TAG" ]; then
            echo "first_tag=true" >> $GITHUB_OUTPUT
            echo "No previous tag found. This is the first release."
          else
            echo "first_tag=false" >> $GITHUB_OUTPUT
            echo "previous=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "Previous tag: $PREVIOUS_TAG"
          fi

      - name: Compare package.json between tags
        # On n'exécute cette vérification que s'il y a un tag précédent
        if: steps.tags.outputs.first_tag == 'false'
        run: |
          git show ${{ steps.tags.outputs.previous }}:package.json | jq -r '.version' > old_version.txt
          git show ${{ steps.tags.outputs.current }}:package.json | jq -r '.version' > new_version.txt
          if diff -q old_version.txt new_version.txt > /dev/null; then
            echo "Error: Version did not change between tags"
            exit 1
          fi

      - name: Check changelog diff between tags
        # Idem ici
        if: steps.tags.outputs.first_tag == 'false'
        run: |
          if git diff --exit-code ${{ steps.tags.outputs.previous }} ${{ steps.tags.outputs.current }} -- changelog.md; then
            echo "Error: changelog.md not updated"
            exit 1
          fi

  create-release:
    runs-on: ubuntu-latest
    needs: check-updates
    name: Create a new Release
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Create a new tag and release

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog for the current version
        id: get_changelog
        run: |
          # 1. Trouver la ligne du DERNIER séparateur ---
          LAST_SEPARATOR_LINE=$(grep -n "^---" changelog.md | tail -n 1 | cut -d':' -f1)

          if [ -z "$LAST_SEPARATOR_LINE" ]; then
            # Si pas de séparateur, on cherche peut-être le dernier titre de version
            LAST_SEPARATOR_LINE=$(grep -n "^## \[" changelog.md | tail -n 1 | cut -d':' -f1)
          fi

          if [ -z "$LAST_SEPARATOR_LINE" ]; then
            echo "Impossible de trouver un point de départ dans changelog.md" && exit 1
          fi

          echo "Extraction à partir de la ligne: $LAST_SEPARATOR_LINE"

          # 2. Extraire tout ce qui est APRES cette ligne jusqu'à la fin du fichier
          # On utilise tail pour prendre tout ce qui suit la ligne du séparateur
          changelog=$(tail -n +$((LAST_SEPARATOR_LINE + 1)) changelog.md)

          # 3. Nettoyer les espaces/lignes vides au début et à la fin
          changelog=$(echo "$changelog" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          if [ -z "$changelog" ]; then
            echo "Le contenu extrait est vide !" && exit 1
          fi

          # 4. Export vers GitHub Output
          echo "Changelog content found."
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ steps.get_version.outputs.version }}

      - name: Check if release already exists
        id: check_release
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $TAG does not exist."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/create-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Release v${{ steps.get_version.outputs.version }}
          body: ${{ steps.get_changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-packages:
    needs: [check-updates, create-release]
    runs-on: ubuntu-latest
    name: Deploy Docker Package Release
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
